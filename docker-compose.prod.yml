services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pdp-postgres
    restart: always
    environment:
      POSTGRES_DB: pdp_prod
      POSTGRES_USER: pdp_user
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - /data/pdp/pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdp_user -d pdp_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 6g
    cpus: "2.0"

  redis:
    image: redis:7-alpine
    container_name: pdp-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /data/pdp/redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 1.5g
    cpus: "0.5"

  backend:
    build: ./backend
    container_name: pdp-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL
      - REDIS_URL
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /data/pdp/logs:/app/logs
      - ./web-dist:/app/web-dist:ro
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 4g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: pdp-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/nginx/ssl:/etc/nginx/certs:ro
    mem_limit: 512m
    cpus: "0.5"

volumes:
  pgdata:
  redisdata:
