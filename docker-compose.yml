services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdp
      POSTGRES_USER: pdp
      POSTGRES_PASSWORD: pdp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      PDP_DATABASE_URL: postgresql+psycopg://pdp:pdp@postgres:5432/pdp
      PDP_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:

